      - >-
        Rock and mountain Pokémon among the boulders. The mist is the usual weather here, not a condition (weather.md).

  - id: route_14
    name: Route 14
    maps: [route_14]
    used: confirmed
    facts:
      tiles: { grass: 134, dark_grass: 61, surf: 424 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: { all seasons: white mist (WEATHER_TINT_9) on 73% to 85% of days }
    picture: >-
      A mountain path from the coast (Undella's coast at its very top, without encounters) up to White Forest or Black
      City: numerous rivers of clear, fresh mountain water, overgrown paths, waterfalls leading up onto the many cliffs,
      and a path inland to Abundant Shrine. A mountainous riverland hike.
    habitats: [river, waterfall, mountain, cliff, woodland_edge]
    parts:
      grass: overgrown paths between the rivers
      dark_grass: thick growth on the cliffs above the falls
      rivers: clear, cold mountain rivers and waterfalls
    human_presence: remote
    climate:
      spring: cool, misty, snowmelt
      summer: mild, misty
      autumn: cool, misty
      winter: cold, misty
    features: [cold_water, rocks, tall_trees]
    real_world: >-
      Appalachian cascades: trout and salamanders in cold, clear water, dippers and kingfishers, otters, herons;
      mosses and ferns in the spray; black bears along the streams.
    suggestions:
      - >-
        Cold-water river life (trout country: Red-Striped Basculin, salamanders, otters) and birds of fast water.

  - id: abundant_shrine
    name: Abundant Shrine
    maps: [abundant_shrine]
    used: confirmed
    facts:
      tiles: { grass: 97, dark_grass: 135, surf: 56 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      Mountain farmland: terraced fields and still, reflective ponds round the farms, with a shrine on the hill: almost
      the Japanese countryside (the user may give Celebi an event at the shrine; not wild). Diglett tills the soil here
      (Pokécology), besides its caves. Dark grass further up the hill than the grass.
    habitats: [farmland, hills, pond, conifer_forest]
    parts:
      grass: the lower terraces among the fields
      dark_grass: higher up the hill, wilder
      ponds: still, reflective ponds among the fields
      shrine: the shrine at the top of the hill
    human_presence: rural
    climate:
      spring: mild, planting
      summer: warm, humid, green
      autumn: cool, harvest
      winter: cold, fallow
    features: [berries, flowers, spirits]
    real_world: >-
      Satoyama-like farmland (fields, not paddies: the user, 2026-11-14): terraced fields kept for centuries, still water full of frogs and tadpoles, dragonflies over
      it, fireflies on summer nights, crickets in autumn, herons and egrets, foxes at the shrine (Inari's messengers),
      carp in the ponds. The original games' shrine of the Forces of Nature: the harvest, and the storms.
    suggestions:
      - >-
        Diglett tilling the fields (requested); frogs, dragonflies and fireflies at the ponds (fireflies on summer
        nights: Volbeat and Illumise), crickets in autumn, a shrine fox.
      - >-
        The Forces of Nature's storms (Tornadus and Thundurus, not wild) as weather: a rare thunderstorm or gusty rain
        here and on Route 14, with the Pokémon such storms bring.
