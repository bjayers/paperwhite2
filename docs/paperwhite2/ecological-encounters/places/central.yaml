# Central Unova (regions.md, 4): Route 5, Route 16, Lostlorn Forest, Marvelous Bridge, Route 15, Route 14 and Abundant
# Shrine. Draft of 2026-11-13 from the user's descriptions, for review. The layout is southwest.yaml's. No Pokémon NPCs
# are placed here yet.

region:
  id: central
  name: Central Unova
  feel: >-
    The plains round Nimbasa: civilization, but wild. Nimbasa itself is Coney Island: amusement parks and sports, always
    a celebration with an upbeat, competitive air, where much could fly under the radar (a Zorua from Lostlorn hiding
    in plain sight as a child: an NPC, never wild). East of the plains, rugged mountain country with mist, rivers and
    waterfalls, rising toward Black City or White Forest, and mountain farmland round Abundant Shrine.
  towns: >-
    No encounters, mood only. Nimbasa City (above). Black City and White Forest: no wild Pokémon, and too unlike their
    surroundings to shape them.
  real_world: >-
    The edge of a big city's sprawl (litter, scavengers, park pests), then northeastern woodland and Appalachian
    mountain country: misty ridges, boulder fields, cold streams with trout and salamanders, and terraced hill farms
    (for Abundant Shrine, farmland with a satoyama's feel: terraced fields and still ponds, frogs and dragonflies, fireflies,
    foxes at the shrine).
  basculin: Red-Striped (east of the Castelia, Nimbasa and Opelucid line)

places:

  - id: route_5
    name: Route 5
    maps: [route_5]
    used: confirmed
    facts:
      tiles: { grass: 74, dark_grass: 42 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: none
    picture: >-
      An autumn tailgate, the feel of a college homecoming: a wide paved road with many people, a lot of litter where
      they are, Munchlax and the like roaming for leftovers. A camper with a cook outside it (beaten, she talks about
      baking and her Pokémon helping her). To the north, a narrow wooded strip at the foot of a cliff; to the west,
      the Driftveil Drawbridge. The user's requests: Gothita and Solosis rarely, Munchlax rarely.
    habitats: [park, woodland_edge, cliff]
    parts:
      grass: grass by the busy road, littered, and the narrow wooded strip at the foot of the cliff
      dark_grass: side by side with the grass, the same ground (the split is for gameplay, rules 6)
    human_presence: suburban (crowds)
    climate:
      spring: mild
      summer: warm
      autumn: cool, the tailgate season
      winter: cold
    features: [garbage, berries]
    real_world: >-
      Event grounds and roadsides: scavengers drawn by food waste (raccoons, crows, gulls, rats), feral cats, and wildlife
      at the woods' edge.
    suggestions:
      - >-
        Scavengers and food-lovers by the road (trash and leftovers), more at busy times; the cook's sweet-loving
        Pokémon as strays; woodland edge life from the strip under the cliff.

  - id: route_16
    name: Route 16
    maps: [route_16]
    used: confirmed
    facts:
      tiles: { grass: 33, dark_grass: 68 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: none
    picture: >-
      Between Nimbasa and Marvelous Bridge: buildings on the west side as Nimbasa's urban area ends, a paved road with
      bikers, and a tall fence between it and the wooded forest edge to the north, which leads to Lostlorn Forest.
      Paved road right at the edge of the forest.
    habitats: [woodland_edge, suburb]
    parts:
      grass: verges of the road
      dark_grass: the forest edge behind the fence, toward Lostlorn
    human_presence: suburban
    climate:
      spring: mild
      summer: warm
      autumn: cool
      winter: cold
    real_world: >-
      A road along a forest edge: edge species (rabbits, foxes, songbirds, snakes on warm tarmac), and forest animals
      venturing out at dusk.
    suggestions:
      - A blend of Nimbasa's city edge and Lostlorn's forest, the forest's side stronger in the dark grass.

  - id: lostlorn_forest
    name: Lostlorn Forest
    maps: [lostlorn_forest]
    used: confirmed
    facts:
      tiles: { grass: 93, dark_grass: 74, surf: 22 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      A small forest where everything feels a bit off: the home of Zorua and Zoroark (never wild: NPCs under
      illusions), and so of illusions and a sense that something's not quite right (not the Dreamyard's dreams). The
      entry crosses a small stream with a waterfall; on the cliff above the waterfall, the dark grass; on the forest
      floor, grass round a stump; in the north, a clearing with a few trees, many flowers and stumps. The usual forest
      Pokémon (perhaps some Combee), but most are the "off" ones: Spinda, the elemental monkeys (Pansage, Pansear,
      Panpour), things like that.
    habitats: [deciduous_forest, stream, waterfall, meadow]
    parts:
      grass: the forest floor round a stump
      dark_grass: wild grass on the cliff above the waterfall
      clearing: a clearing with flowers and stumps in the north
      stream: a small stream with a waterfall at the entry
    human_presence: remote (a camper lives there in the original)
    climate:
      spring: mild, flowers
      summer: warm
      autumn: cool
      winter: cold
    features: [flowers, dead_wood, berries, spirits]
    real_world: >-
      A small forest with a stream and a flowery clearing: the usual forest life, and the folklore of forests where
      travellers lose their way, tricksters and will-o'-wisps.
    suggestions:
      - >-
        Tricksters, mimics and the strange: Spinda's dizzy wandering, the monkeys, Pokémon that disguise themselves or
        look like something else, and things seen only at night. The usual forest life beside them, as a backdrop.
      - The stream: a little cold-water life (Red-Striped Basculin).

