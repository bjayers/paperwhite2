      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: { all seasons: white mist (WEATHER_TINT_9) on 73% to 85% of days }
    picture: >-
      A rugged mountain route between Marvelous Bridge and Black City or White Forest: many Strength boulders and
