    maps: [marvelous_bridge]
    used: confirmed
    facts:
      tiles: { bridge: 924 }
      methods: [rustling (bridge shadows)]
      weather: none
    picture: >-
      Bridge inhabitants: probably birds, if any.
    habitats: [coastal_sea]
    parts:
      shadows: birds' shadows on the bridge
    human_presence: rural (a road)
    climate:
      all_year: open, windy
    real_world: >-
      Big bridges: gulls and cormorants on the cables, falcons nesting on the towers, swallows under the deck.
    suggestions:
      - Seabirds and raptors in the shadows, by season (the migration plan).

