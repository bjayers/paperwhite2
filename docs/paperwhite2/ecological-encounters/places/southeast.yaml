# Southeast Unova (regions.md, 3): Routes 1 to 3, Striaton City, Wellspring Cave, the Dreamyard and Pinwheel Forest.
# Draft of 2026-11-13 from the user's descriptions, for review. The layout is southwest.yaml's. No Pokémon NPCs are
# placed here (the user's NPCs stop at Castelia), and nothing has weather yet (weather.md).

region:
  id: southeast
  name: Southeast Unova
  feel: >-
    Suburbs with farmland, parks and nearby landmarks, and the original games' "start of an adventure" feel, round
    the old starting towns (Nuvema, Accumula, Striaton, Nacrene). It holds Pinwheel Forest, the region's premier
    forest. Mild winters, without the Southwest's snow.
  towns: >-
    No encounters, mood only. Nuvema Town: the original starting town and the professor's lab, so the region's
    Pokémon should feel like a start (whole families still, at their levels). Accumula Town: quiet, with vines on its
    white walls. Nacrene City: the museum and many artists; old, with a railway through the town.
  real_world: >-
    The suburbs and shore of Long Island and New Jersey: seaside pines and dunes, old fields and flower meadows,
    suburban parks and ponds, lakes; and old-growth broadleaf forest, damp and mossy, with fallen logs, fungi,
    salamanders, frogs and an abundance of insects. Spring and autumn migrants pass along the coast.
  basculin: Red-Striped (the Southeast is east of the Castelia, Nimbasa and Opelucid line)

places:

  - id: route_1
    name: Route 1
    maps: [route_1]
    used: confirmed
    facts:
      tiles: { grass: 177, dark_grass: 155, surf: 132 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      Normal grass on the main route between Nuvema and Accumula, with strong seasonal imagery: pink flowers in
      spring, yellow sunflowers in summer, cotton- or wheat-like plants in autumn, and dried plants in winter. A strong
      candidate for seasonal inhabitants: Sunkern and Sunflora in summer, Cottonee and Whimsicott in autumn, Cherubi
      in spring, perhaps another flower Pokémon. Across a short stretch of water (in Black and White it kept the
      player from the endgame routes), the dark grass: hills and a seaside with pine trees.
    habitats: [meadow, flower_field, hills, conifer_forest, coastal_sea, rocky_shore]
    parts:
      grass: >-
        the main route's meadow, its flowers changing by season: pink blossom in spring, sunflowers in summer, cotton
        or wheat in autumn, dry stems in winter
      dark_grass: >-
        hills of wild grass among seaside pines, across the water from the main route: a separate environment
        (another family's place, not the main route's tougher version)
      water: >-
        the rocky inlet between them, part of the sea (salt water); the strip of sea along the west edge can't be
        reached (Route 17 is through the green gate)
    human_presence: rural
    climate:
      spring: mild, blossom
      summer: warm, sunflowers
      autumn: mild, seed heads
      winter: cool, dry stems, no snow
    features: [flowers, berries]
    real_world: >-
      Meadows managed for flowers, and seaside pine and dune behind them: bees and butterflies in spring and summer,
      seed-eating birds in autumn, rabbits and voles in the grass, hawks hunting them; on the pine hills, foxes,
      snakes, owls, and pine-loving birds.
    suggestions:
      - >-
        The meadow by season, after its flowers: Cherubi (and another flower) in spring, Sunkern and Sunflora in summer
        (Sunflora strict to the day: rules 7), Cottonee and Whimsicott in autumn, little in winter.
      - >-
        The pine hills (dark grass) as their own world: pine and seaside Pokémon, unchanged by the meadow's seasons.

  - id: route_2
    name: Route 2
    maps: [route_2]
    used: confirmed
    facts:
      tiles: { grass: 165 }
      methods: [grass, rustling (shaking grass)]
      weather: none
    picture: >-
      A typical, mildly forested route: a dirt road with patches of grass beside it.
    habitats: [woodland_edge, deciduous_forest]
    parts:
      grass: patches of grass along a dirt road through light woods
    human_presence: rural
    climate:
      spring: mild
      summer: warm
      autumn: mild
      winter: cool
    real_world: >-
      Roadside woodland edge: songbirds, squirrels, rabbits, garter snakes; a corridor between towns that common
      generalists use.

  - id: striaton_city
    name: Striaton City
    maps: [striaton_city]
    used: confirmed
    facts:
      tiles: { surf: 75 }
      methods: [surf, fishing]
      weather: none
    picture: >-
      A nice city with the restaurant, and a park to the west (between the city and Route 3) with seemingly man-made
      ponds and a fountain; the encounters are the ponds, fresh water. The city connects to the Dreamyard in the east.
    habitats: [park, pond, suburb]
    parts:
      ponds: ornamental freshwater ponds round a fountain, in a formal park with hedges and an arbour
    human_presence: suburban
    climate:
      spring: mild
      summer: warm
      autumn: mild
      winter: cool
    features: [flowers]
    real_world: >-
      Ornamental park ponds: goldfish and carp (some released pets), ducks, frogs, dragonflies.
    suggestions:
      - Ornamental fish, released pets among them (Goldeen, Magikarp).
    requests:
      - Feebas as a trophy (exotic) in the ponds; Feebas is a trophy wherever it fits, not only here.

  - id: route_3
    name: Route 3
