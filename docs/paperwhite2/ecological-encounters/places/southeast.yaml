      An abandoned industrial site gone wild: weeds and scrub, foxes and rats, owls and bats in the empty buildings.
    suggestions:
      - >-
        Dream Mist and psychic research: the dream Pokémon (Munna's family) and other psychics, at night above all; the
        basement as the place for a psychic trophy.

  - id: pinwheel_forest_outskirts
    name: Pinwheel Forest (the outskirts)
    maps: [pinwheel_forest]
    used: confirmed
    facts:
      tiles: { grass: 191, dark_grass: 74 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: none
    picture: >-
      A short road west of Nacrene, between the city and the forest proper. South of the road, many puddles (only
      cosmetic, no encounters) with ample grass, and a raised cliff with more grass and puddles; small flowers dotted
      round; the railway continues partly onto the map. A breeding ground for mosquitoes, dragonflies and the like, so
      near the forest.
    habitats: [meadow, marsh, woodland_edge, cliff]
    parts:
      grass: grass among shallow puddles south of the road
      dark_grass: grass on the raised cliff, with more puddles
    human_presence: rural
    climate:
      spring: mild, wet
      summer: warm, humid
      autumn: mild
      winter: cool
    features: [flowers]
    real_world: >-
      Wet meadow at a forest's edge: mosquitoes and midges breeding in the pools, dragonflies hunting them, frogs, and
      the birds and bats that feed on the insects at dusk.
    suggestions:
      - >-
        The insects' nursery: biting and buzzing bugs and their hunters (dragonflies, Yanma's family; frogs), busiest
        in summer and after rain. Not water Pokémon: the puddles have no encounters.

  - id: pinwheel_forest
    name: Pinwheel Forest
    maps: [pinwheel_forest_2]
    used: confirmed
    facts:
      tiles: { grass: 804, dark_grass: 295, surf: 186 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      The big, dark forest of the region, another of the user's favourites: under a canopy, with dappled light. A road
      runs through from Nacrene to Skyarrow Bridge, over a small pond littered with fallen leaves. The grass by the
      road is normal; further into the forest it turns dark green and mossy, with fallen trees to walk through and
      stumps. The Moss Rock is here (Eevee evolves into Leafeon). Across the road, the mystic clearing where Virizion
      was found in Black and White, now a story event. A living forest that lives and breathes like its Pokémon, whose
      inhabitants change and grow through the seasons.
    habitats: [dense_forest, deciduous_forest, pond]
    parts:
      grass: grass by the road, in the forest's lighter parts
      dark_grass: dark, mossy undergrowth deep in the forest, among fallen trees and stumps
      pond: a small, still pond under the road, covered in fallen leaves
      clearing: the mystic clearing across the road (Virizion's story event; not wild)
    human_presence: wild
    climate:
      spring: mild, damp, budding
      summer: warm, humid, deep shade
      autumn: cool, leaf fall
      winter: cold, bare, quiet
    features: [dead_wood, fallen_leaves, mushrooms, tall_trees, leaf_influence]
    real_world: >-
      Old-growth broadleaf forest: a life cycle through the year: caterpillars and blossom in spring, insects at their
      height in summer, fungi and leaf litter in autumn, quiet hibernation in winter. Woodpeckers and owls in the big
      trees, salamanders and snails under the logs, deer and foxes, beetles in dead wood; a leaf-choked pond for frogs
      and newts.
    suggestions:
      - >-
        The bug families through their life cycle across the seasons (larvae in spring, adults in summer, cocoons and
        late broods in autumn, few in winter), the forest's grass and fungus Pokémon, its owls and woodpeckers, and the
        dark-grass depths for the bigger, shyer forest Pokémon.
    requests:
      - >-
        Leafeon as a trophy (exotic) in the mossy depths in spring and summer: the Moss Rock's influence (rules 5).
      - The leafy pond: frogs and still-water life, little else.
