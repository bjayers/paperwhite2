# Northern Central Unova (regions.md, 7): Route 9, Route 11, Village Bridge, Route 12, Giant Chasm (its outside, its
# caves and its crater), Route 23 and Victory Road (its mountainside, forest, caves and ruins). Draft of 2026-11-13 from the
# user's descriptions, for review. The layout is southwest.yaml's. No Pokémon NPCs are placed here yet.

region:
  id: north_central
  name: Northern Central Unova
  feel: >-
    Rugged endgame territory, wild and sometimes mysterious: from Opelucid's outskirts to rustic Village Bridge, the
    flowery hills of Route 12, the mysterious Giant Chasm and the rugged cliffs of Route 23.
  towns: >-
    No encounters, mood only: Opelucid City, and Lacunosa Town by Giant Chasm.
  real_world: >-
    River country and hill pasture, then mountains: waterfalls and gorges, wildflower hills with bees, a river village,
    and the cold and strange of a crater.
  basculin: >-
    Red-Striped wherever it lives here (Route 9 is west of Opelucid but has no water)

places:

  - id: route_9
    name: Route 9
    maps: [route_9]
    used: confirmed
    facts:
      tiles: { grass: 81, dark_grass: 52 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: none
    picture: >-
      Opelucid's outskirts and the Shopping Mall: between Route 5 and Route 16 in feel, not as much the wilderness's
      edge as Route 16, not as busy as Route 5; full of roughnecks and bikers. A road from Opelucid to Tubeline Bridge;
      north of it the mall and a small rest area with flower bushes, vending machines and a trash can; the south full
      of both grasses and some trees, behind a short white fence. (The Challenger's Cave was reached from here; it's
      blocked off in Black 2 and White 2, its maps unused placeholders.)
    habitats: [suburb, meadow, woodland_edge]
    parts:
      grass: the grass and trees south of the road, grass and dark grass side by side
      rest_area: flower bushes, vending machines and a trash can by the mall (scenery)
    human_presence: suburban
    climate:
      spring: mild
      summer: warm
      autumn: cool
      winter: cold
    features: [garbage, flowers]
    real_world: >-
      Shopping-centre edges and verges: scavengers at the bins, pigeons and crows, feral cats, and meadow life in the
      rough ground beyond the fence.
    suggestions:
      - Scavengers drawn by the mall and the rest area, and the outskirts' meadow life.

  - id: route_11
    name: Route 11
    maps: [route_11]
    used: confirmed
    facts:
      tiles: { grass: 156, dark_grass: 124, surf: 335 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      Many cliffs and waterfalls, and another camper. A lower level below the waterfall to the east: the grass above,
      the dark grass below (separate places). The user sees it as a place for fighting Pokémon by the waterfalls: Throh
      and Sawk in the two different grasses now, perhaps Tyrogue's evolutions.
    habitats: [river, waterfall, cliff, conifer_forest, meadow]
    parts:
      grass: up on the cliffs above the waterfall
      dark_grass: the lower level below the waterfall, to the east (a different habitat)
      water: rivers and waterfalls between cliffs
    human_presence: rural
    climate:
      spring: cool, snowmelt
      summer: mild
      autumn: cool
      winter: cold
    features: [cold_water, rocks]
    real_world: >-
      Waterfalls are where martial artists train in Japanese tradition (takigyō, meditation under the falls); and a
      gorge's cold water, dippers, otters and trout.
    suggestions:
      - >-
        Fighting Pokémon training by the falls, split between the two levels as counterparts (rules 5's branches):
        Throh above and Sawk below, Hitmonlee and Hitmonchan the same way from Tyrogue (Tyrogue in both).
      - Cold-water river life (Red-Striped Basculin).

  - id: village_bridge
    name: Village Bridge
    maps: [village_bridge]
    used: confirmed
    facts:
      tiles: { grass: 132, dark_grass: 78, surf: 828 }
      methods: [grass, dark_grass, rustling (bridge shadows), surf, fishing]
      weather: none
    picture: >-
      One of the user's favourites: a large, quaint stone bridge over a sizable river with a whole village on it,
      parks, forest clearings, a basketball court and a tennis court round it, cobblestone paths and a stone room
      under the bridge. Musicians round the area each add an instrument to the music when spoken to: a folksy music
      theme. A fisherman under the bridge: a great spot for fishing. Northwest, the basketball court (vending machine,
      trash can, the guitarist); southwest, a field of grass; northeast, a small clearing with a flautist, covered in
      yellow flowers all year and ringed by dark grass (a separate habitat); southeast, the tennis court; under the
      bridge on the west bank, a man by a barrel, the singer, who seems to live there; and a small patch of dark grass
      on a cobblestone island in the river north of the bridge.
    habitats: [river, meadow, park, deciduous_forest, suburb]
    parts:
      grass: the open field to the southwest
      dark_grass: >-
        the woods ringing the flowery clearing to the northeast (a different habitat from the field), and a patch on a
        cobblestone island in the river
      clearing: yellow flowers all year, round the flautist
      river: a big river under the stone bridge, a fishing spot
      shadows: birds under and over the bridge
    human_presence: rural (a village)
    climate:
      spring: mild
      summer: warm
      autumn: cool
      winter: cold
    features: [flowers, garbage]
    real_world: >-
      A river village: swallows and martins nesting under the arches, pigeons, kingfishers, river fish and the anglers
      who come for them; and crickets and birdsong for the music.
    requests:
      - Seaking spawning at the bridge in autumn (Pokécology).
    suggestions:
      - >-
        The music theme: Pokémon that sing or chirp, quietly (Kricketot's family singing at dusk, Chatot, Jigglypuff,
        Altaria in winter; not the noisy Whismur line, the user), with the flautist's flowery clearing for pollinators.
      - The river's fish at the fishing spot, swallows under the bridge (the shadows).

  - id: route_12
    name: Route 12
    maps: [route_12]
    used: confirmed
    facts:
      tiles: { grass: 132, dark_grass: 100 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: { spring: rain 26%, summer: clear, autumn: rain 26%, winter: rain 55% }
    picture: >-
      Hills covered in white and yellow flowers, with a green, overgrown grass road through them; dark grass in the
      north, grass by the road. Like Floaroma Town and its surroundings in Sinnoh: a honey tree would be at home here.
      Many bees (Combee, requested) and pollinators. Spring more than anything.
    habitats: [flower_field, hills, meadow]
    parts:
      grass: flowery grass by the road
      dark_grass: wilder grass on the hills to the north
    human_presence: rural
    climate:
      spring: mild, flowers
      summer: warm, flowers
      autumn: mild, rainy
      winter: cool, rainy (the user may add a few snowy days)
    features: [flowers, berries]
    real_world: >-
      Wildflower hills: bees and their hives, butterflies and moths, hummingbirds, and the predators of bees (bears
      after the honey, wasps).
    requests:
      - Combee (its family).
    suggestions:
      - >-
        The honey tree's Pokémon (Sinnoh): Combee, Burmy and Mothim (which steals Combee's honey, Pokécology), Heracross,
        Aipom, Cherubi, Wurmple; Munchlax and Teddiursa drawn by the honey; and pollinators (Butterfree with flowers,
        Pokécology).

