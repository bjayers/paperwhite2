      water: the cave with water
    human_presence: remote
    climate:
      all_year: cold, unnaturally
    features: [space, rocks, ice]
    real_world: >-
      Cold caves: bats, ice formations.
    suggestions:
      - Cave dwellers of the cold, and space-touched rock Pokémon (Lunatone and Solrock's kin).

  - id: giant_chasm_crater
    name: Giant Chasm (the crater)
    maps: [giant_chasm_3, giant_chasm_4]
    used: >-
      confirmed: zones 3 and 4 are two versions of the same crater map (one for Team Plasma's story event), sharing
      their Pokémon
    facts:
      tiles: { grass: 215, dark_grass: 260 }  # zone 3
      tiles_4: { grass: 111, dark_grass: 108 }
      methods: [grass, dark_grass, rustling (shaking grass)]
      weather: none
    picture: >-
      The most mysterious part: cold and wintry by Kyurem's influence, but unnatural, unlike Icirrus's or the
      Southwest's winters. The place for otherworldly and space Pokémon: Clefairy, Solrock, Beldum and the like;
      perhaps Deoxys's event in the crater; Ditto a candidate (perhaps Lostlorn too).
    habitats: [dense_forest, meadow, snowfield]
    parts:
      grass: the crater floor's forest and clearings
      dark_grass: thick growth in the crater
    human_presence: wild
    climate:
      all_year: cold and wintry, unnaturally (Kyurem)
    features: [space, ice, ancient]
    real_world: >-
      A meteorite crater: the lore of things from the sky, and a forest growing where nothing should be cold.
    suggestions:
      - >-
        Space and otherworldly Pokémon: Clefairy's family (the moon), Solrock and Lunatone, Beldum's family, Elgyem and
        Beheeyem (sightings of things from space), Minior; Ditto; unnatural cold (Cryogonal, Vanillite's family).

  - id: route_23
    name: Route 23
    maps: [route_23]
    used: confirmed
    facts:
      tiles: { grass: 388, dark_grass: 77, surf: 263 }
      methods: [grass, dark_grass, rustling (shaking grass), surf, fishing]
      weather: none
    picture: >-
      A large route ringed by cliffs. It starts on cobblestone paths by the river and follows it north over a few short
      bridges, then climbs onto the cliffs with bridges hung high in the air. The western part lacks an identity: partly
      woodsy, partly rocky, with maze-like paths through the trees. Mostly grass, with a patch of dark grass high on a
      small island of rock cliffs, mostly ringed by trees. The water is mostly the river between the cliffs, with a
      still, reflective pond to the west.
    habitats: [river, cliff, mountain, conifer_forest, pond]
    parts:
      grass: by the river and through the western woods and rocks
      dark_grass: a patch high on a small island of cliffs, ringed by trees
      river: the river between the cliffs, under bridges
      pond: a still, reflective pond to the west
    human_presence: remote
    climate:
      spring: cool
      summer: mild
      autumn: cool
      winter: cold
    features: [rocks, cold_water, tall_trees]
    real_world: >-
      A gorge and its rim: cliff-nesting raptors, rock dwellers, cold river fish; the high country before the League.
    suggestions:
      - >-
        An identity for the western maze: an old conifer wood among boulders where forest predators hunt (a labyrinth of
        trees suits stalkers and ambushers), so the route has the gorge, the river and the wood.
      - Cliff and mountain Pokémon on the heights, river fish below, still-water life in the pond.

