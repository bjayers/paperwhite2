# The east coast (regions.md, 8): Route 13, Undella Town and Bay, Seaside Cave, Route 21, Humilau City and Route 22.
# Draft of 2026-11-13 from the user's descriptions, for review. The layout is southwest.yaml's. No Pokémon NPCs are
# placed here yet, and nothing has weather yet.

region:
  id: east_coast
  name: The east coast
  feel: >-
    Beachy, almost tropical: crystal-clear blue sea, beaches under cliffs, an upscale holiday town, and a Hawaiian
    lagoon at Humilau. Little change in winter on land; the sea's life and the birds change with the seasons, and
    tourism peaks in summer (people bring their Lapras to Humilau and Undella then).
  real_world: >-
    From a temperate holiday coast to the tropics: sandy beaches and dune grass, rocky islets with seabird colonies,
    open sea with dolphins, rays and jellyfish, a warm coral lagoon on the edge of a reef shelf, with sea turtles, reef
    fish and coral; and summer crowds that disturb the shallows.
  sea: >-
    A gradient of water: Route 13's and Undella's clear coastal sea, the open sea of Undella Bay and Route 21 (rocky
    and maze-like on Route 21), and Humilau's warm, shallow lagoon over coral, with a rocky shelf beyond.
  pokecology: >-
    Corsola gather in warm seas and hide smaller Pokémon, moving to warmer seas in the cold seasons; Lapras overhunt
    the fish in summer near Humilau, and the fish return when they're fewer; Tentacruel's outbreaks clear the seas;
    Shellos: the West Sea form in warmer waters, the East Sea form in cooler; Lileep in shallow sea.

