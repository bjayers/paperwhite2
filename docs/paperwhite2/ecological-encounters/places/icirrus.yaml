      methods: >-
        walking (swamp puddles, spring to autumn), surf, fishing; in winter only surf and fishing
      weather: { spring: rain 64%, summer: rain 26%, autumn: rain 65%, winter: snow 55%, blizzard 17%, diamond dust 1% }
    picture: >-
      An idyllic town with windmills round it, on raised ground surrounded by puddles and marshland.
    habitats: [marsh, swamp, pond, suburb]
    parts:
      puddles: shallow swamp puddles and marsh round the town (frozen in winter)
      water: deeper marsh water (open all year)
    human_presence: rural
    climate:
