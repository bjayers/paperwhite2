# Icirrus (regions.md, 6): Icirrus City, Route 8, the Moor of Icirrus and Dragonspiral Tower (its entrance, its grounds,
# and the tower). Draft of 2026-11-13 from the user's descriptions, for review. The layout is southwest.yaml's. No
# Pokémon NPCs are placed here yet.

region:
  id: icirrus
  name: Icirrus
  feel: >-
    A quaint town among windmills and marshes for most of the year; in winter, a winter wonderland: the wetlands
    freeze over, heavy snow covers everything, and places out of reach the rest of the year can be reached over the
    snow piles.
  winter: >-
    The swamp puddles of Icirrus City, Route 8 and the Moor freeze: the player slides on the ice, and walking gives no
    encounters there in winter (tiles.json). The surfable water stays open, for surfing and fishing as usual.
    Dragonspiral Tower's entrance gains dark grass.
  real_world: >-
    Fen and bog country with windmills, like the Dutch polders: reeds, sedge and peat pools, frogs and newts,
    dragonflies, waders, herons, ducks; catfish and eels in the mud. In winter the fens freeze hard: animals sleep
    under the ice or in the mud, and northern birds arrive. Above it, an ancient tower by a deep, clear, cold lake.
  basculin: Blue-Striped (west of the Castelia, Nimbasa and Opelucid line)

