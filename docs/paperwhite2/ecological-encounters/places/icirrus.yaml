      A town in the fens: frogs and toads, newts, snails, mud-dwelling fish, dragonflies, herons.
    suggestions:
      - >-
        Marsh and mud Pokémon in the puddles from spring to autumn (Stunfisk, which lives in Icirrus's mud in the
        original games), mud-dwelling fish in the water all year, which in winter are the only Pokémon to be had here.

