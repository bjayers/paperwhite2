# Batch 3: bugs and forest (40 families). Draft of 2026-11-14 for review.
#
# Summary
# - The bugs' year: caterpillars and larvae in spring, adults in summer, cocoons, spiders and late broods in autumn,
#   few in winter (Ledyba the exception: autumn and winter leaves, Pokécology). Route 20 peaks in autumn (cocoons,
#   moths, spiders, mushrooms, as its NPCs show); Pinwheel Forest is the bugs' life cycle through the year.
# - Mushrooms (Shroomish, Foongus, Paras) peak in autumn in the Southwest's woods, where Swinub dig in winter
#   (Pokécology; the mountains batch); Paras also in Reversal Mountain's Damp Caves.
# - Route 12 is Floaroma's honey trees (the user's request): Combee, Burmy and Mothim, Heracross, Aipom, Cherubi,
#   Wurmple, Teddiursa, Butterfree. The night lights of Route 9's mall and Route 16 draw Venonat and Dustox.
# - Route 18 is the tropical island: Exeggcute and Exeggutor (the user's request), Bellsprout, Aipom, Slakoth,
#   Tangela. Its jungle and Pinwheel Forest's depths are this dictionary's Leaf Stone sites (rules.md, 5): Exeggutor,
#   Victreebel and Shiftry are wild only there, and rarely.
# - Predators and prey: Yanma is rarer where Swellow hunt it (Routes 6 and 7 in summer); Durant's colonies share their
#   places with Heatmor (the desert batch); Mothim with Combee.
# - Lostlorn Forest's "off" Pokémon: the elemental monkeys (all three, the user's request), Foongus's Poké Ball mimicry.
# - Trophies: Heracross on Route 12, Pinsir in Pinwheel's depths, Scyther in Route 7's tall grass, Vespiquen on Route 12.
# - Not wild: Scizor, Escavalier, Accelgor (trades), Shedinja, Leavanny and the Simi monkeys (stones), Bellossom and
#   Vileplume (stones, outside the two sites), Cherrim's sunshine form (it's a battle form).
# - Review: the two Leaf Stone sites; Burmy's cloaks by place; Tangrowth wild; the Tangrowth-Cubone note (unused).

