# Batch 6: desert, fire and heat (20 families). Draft of 2026-11-14 for review.
#
# Summary
# - The desert (Route 4, the Desert Resort and its canyon path, Relic Castle and Relic Passage): burrowers and pit
#   trappers (Sandshrew, Trapinch, Hippopotas, Sandile), cacti (Cacnea, Maractus, with the birds' Natu), night hunters
#   (Cacturne, Skorupi, Krokorok), Darumaka by day. Sandstorm Pokémon (Pokécology, the user's request): Flygon raises
#   the storms and Krookodile hides in them, both sandstorm-only in the desert; Route 4's are White 2's only, as its
#   sandstorm is, unless the user adds sandstorms to Black 2's (weather.md).
# - Sandile in Castelia's sewers in the dry autumn and winter, in from Relic Passage (the user's request).
# - Reversal Mountain's Fiery Caves are Unova's home for fire Pokémon (the user's request): Slugma, Numel, Torkoal,
#   Magmar, Houndour, Heatmor hunting Durant; a few fire Pokémon outside (Charmander the trophy, Ponyta as wild
#   mustangs, Houndour's night packs, Numel).
# - Virbank Complex's machines (the user's request): Magby in summer and autumn, Elekid in winter and spring, Growlithe
#   the trophy in winter and spring.
# - Cubone in the canyons and at the tomb (Relic Castle) and the graves (Celestial Tower).
# - Not wild: Ninetales and Arcanine (Fire Stones: Ninetales as the shrine's thousand-year fox would make a fine
#   special encounter, report.md), Magmortar and Electivire (trades), Charmeleon and Charizard.
# - Review: "Charmander rarely outside Reversal Mountain" read as Reversal Mountain's outside; Vulpix as Abundant
#   Shrine's fox.

