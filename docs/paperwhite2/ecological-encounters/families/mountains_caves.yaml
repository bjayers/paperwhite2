# Batch 5: mountains, caves and mines, with the ice Pokémon (39 families). Draft of 2026-11-14 for review.
#
# Summary
# - Caves by kind: the south's small caves (Wellspring Cave, Relic Passage) with Woobat, Roggenrola and Drilbur; the
#   mines (Twist Mountain, Clay Tunnel) with the miners' Pokémon (Timburr, Machop), iron-eaters (Aron) and gems
#   (Sableye); Chargestone Cave's magnetic life (Joltik in the bugs' batch, Ferroseed, Klink, Nosepass and Probopass,
#   Tynamo the trophy); the deep, strong caves of Victory Road (Onix, Excadrill, Aggron); Giant Chasm's cold caves.
#   Dust clouds hold the burrowers (Drilbur, Diglett), as the rules say.
# - Zubat and Woobat split the bats: Woobat the south's and the tower's, Zubat the north's and the deep caves'.
# - Pokécology: Dunsparce with Onix and Excadrill (Clay Tunnel); Diglett tilling the farms (Abundant Shrine, the user's
#   request; Floccesy Ranch); Swinub digging mushrooms under the snow where they grew in autumn (Routes 19 and 20,
#   Floccesy, where its NPCs are); Weavile hunting Mamoswine (Giant Chasm, whose unnatural cold keeps an ice age's
#   relic alive); Glalie down from Twist Mountain to hunt Piplup at Dragonspiral's entrance in winter (the user's
#   request); Sudowoodo easier to find in winter, when its tree disguise fails.
# - Ice: Twist Mountain's caves hold the ice Pokémon all year (the user's request), spreading in winter to the snowy
#   places (Dragonspiral's entrance, Routes 6, 7 and 12); Giant Chasm's crater has them all year.
# - Fighters: Route 11's falls (Throh above, Sawk below; Tyrogue in both, Hitmonlee above and Hitmonchan below), monks
#   under Route 14's waterfalls (Meditite), sumo at Abundant Shrine (Makuhita), Mienfoo on Route 14 and 22.
# - Trophies: Riolu (Floccesy in summer and autumn, Virbank Complex 2 in winter and spring: the user's request),
#   Tynamo's line in Chargestone (the user's request), Probopass in Chargestone, Mamoswine in Giant Chasm.
# - Not wild: Crobat, Swoobat, Golem, Steelix, Machamp, Rhyperior, Gliscor, Conkeldurr, Gigalith, Froslass, Lucario,
#   Prinplup and Empoleon (trades, friendship, items or stones).
# - Review: Weavile and Mamoswine wild (item and move evolutions, kept to Giant Chasm); Probopass; Eelektross by a
#   Thunderstone in Chargestone; Piplup's tier.

