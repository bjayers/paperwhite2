# Batch 4: grassland, farm and town edge (46 families). Draft of 2026-11-14 for review.
#
# Summary
# - The generalists (rules.md, 6): Patrat, Lillipup, Purrloin and Pidove's ground counterparts, common through the
#   south and middle, never everywhere; Ekans follows Patrat (Pokécology); Rattata in the city.
# - The city (Castelia's park and the routes at Nimbasa's and Opelucid's edges): scavengers (Zigzagoon, Stunky,
#   Meowth, Rattata), introduced pets (Skitty, Glameow, Snubbull), Pachirisu as the park's squirrel; Eevee as the
#   park's trophy, a lost pet.
# - Farms: Floccesy Ranch's herding dogs (Lillipup), Furret hunted by Mightyena (Pokécology; its NPCs are both),
#   Miltank as the dairy herd, Chansey with Happiny (the user's request), Shinx the winter trophy.
# - Route 22 as the savanna upland: herds (Tauros, Blitzle), burrowers (Nidoran), hunters (Poochyena), Electrike's
#   thunderclouds, Mareep with Ampharos as the headland's beacon.
# - Route 1's meadow by its flowers (the places' plan): Sunkern and Sunflora in summer (Sunkern falls from the sky in
#   the morning), Cottonee and Whimsicott in autumn, Budew and Roselia in spring. Route 1's summer meadow is this
#   dictionary's Sun Stone site with Route 12's flower hills, so Sunflora and Whimsicott are wild there (rules.md, 5).
# - Seasonal: Deerling and Sawsbuck by their season's form on Route 6 (the user's request), Sawsbuck wintering in
#   Lostlorn's shelter; reptiles (Ekans, Seviper) scarce in winter.
# - Trophies: Eevee in Castelia's park, Leafeon in Pinwheel's depths in spring and summer (the user's request),
#   Glaceon in Twist Mountain's caves in winter, Shinx at Floccesy in winter, Pichu at Virbank Complex in summer and
#   autumn (the user's request), Munchlax on Route 5 (the user's request).
# - Not wild: the other Eeveelutions, Nidoqueen and Nidoking, Wigglytuff, Delcatty, Lopunny, Roserade, Blissey,
#   Snorlax (a special sleeping encounter would suit it: report.md), Lickilicky, Cinccino, Lilligant.
# - Review: Pikachu, Jigglypuff and Roselia wild though they come by friendship (they're the natural adults); the
#   Sun Stone site; Route 22's crowd.

