# Batch 10: the starters with wild homes (11 families). Draft of 2026-11-12, from the user's review.
#
# Summary
# - Most starters live wild, very rarely, in a place with a story, instead of only in Hidden Grottoes (the user,
#   2026-11-12): the base form only, as an exotic, and only in post-game places (or late enough to be safe).
#   Totodile (Castelia's sewers), Charmander (Reversal Mountain) and Piplup (Dragonspiral's entrance) have their
#   homes in the water, desert and mountains batches; Squirtle stays out of the pools for a Squirtle Squad event
#   (the user).
# - The Nature Preserve takes two (Bulbasaur, Turtwig), so it isn't packed.

