# Batch 1: birds and other fliers (21 families). Draft of 2026-11-14 for review; migration.md is their seasonal map.
#
# Summary
# - Movers: Pidgey (summers in the north, winters in the Southeast, passing between), Taillow (a summer visitor
#   that follows Yanma; a few winter on Route 18), Starly (winter flocks from the north), Swanna (winters on Icirrus's
#   fens, as whooper swans on the Dutch polders), Delibird (down from the mountains with the snow), Swablu (up and
#   down the mountains), Hoppip (the seasonal winds: spring in the south, summer in the north, gone in winter), Chatot
#   (Route 18 in spring and summer; Castelia's feral colony all year).
# - Residents: Pidove (towns and farms), Murkrow (towns at night, mountain trails), Hoothoot (forests at night),
#   Spearow (dry scrub), Doduo (upland grass), Farfetch'd (Abundant Shrine's paddies, rare everywhere), Skarmory
#   (thorny scrub and Virbank's steel), Rufflet and Vullaby (canyons and badlands), Natu (the desert's cacti, the
#   Dreamyard's ruins), Wingull (every coast), Ducklett (ponds and lakes), Tropius (Route 18), Emolga (forest gliders).
# - Trophies: Farfetch'd at Abundant Shrine; Honchkrow at Route 7 at night; Altaria on Victory Road; Chatot in
#   Castelia's park.
# - Review: Pidgey as a migrant (non-native to Unova); Honchkrow wild (a Dusk Stone evolution); Natu in the desert;
#   Doduo on Floccesy Ranch as a farmed bird; Chatot's seasons; Swanna breeding at Dragonspiral's lake.

