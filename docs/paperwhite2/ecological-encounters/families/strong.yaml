# Batch 8: strong lines, pseudo-legendaries and trophies (11 families). Draft of 2026-11-14 for review.
#
# Summary
# - Never common (rules.md, 8) and mostly late in the game, where their ecology allows: the north's mountains, the
#   League's road and its caves, Giant Chasm, a dragon's lake.
# - Dragons: Dratini in Dragonspiral's clear, deep lake (rippling water: the places' suggestion), Dragonite at sea
#   guiding the shipwrecked (Route 17's currents); Deino and Druddigon in Victory Road's dark caves (Druddigon running
#   the tunnels Onix and Excadrill dig, its Pokédex says, so Clay Tunnel too); Bagon leaping off Route 23's cliffs;
#   Gible in Relic Passage's sandy caves; Axew in Mistralton Cave (the original's), Fraxure with Bisharp on Route 23
#   (Pokécology: same place), sharpening its tusks on the river's rocks.
# - Larvitar born deep under Victory Road, Pupitar and Tyranitar on its mountain; Beldum's line at Giant Chasm (the
#   user's request).
# - Absol comes out of the mountains with the storms (weather-only homes on Routes 14 and Abundant Shrine).
# - Bouffalant herds on the north's open hills (Route 12) and by Route 9.
# - Review: the number of trophies at Victory Road; Dragonite wild at all.

