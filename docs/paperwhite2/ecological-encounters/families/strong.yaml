      - "Pokédex (B2W2, Dragonite): it lives somewhere in the sea and guides shipwrecked crews to shore."
      - "The places: Dragonspiral's clear, deep, cold lake as a dragon's water (Johto's Dragon's Den is a sacred lake)."
      - "In the game: a gift Dratini at Floccesy Town; a Hidden Grotto Dragonite on Route 18."
