# Batch 7: ghosts, psychic, space and the strange (32 families). Draft of 2026-11-14 for review.
#
# Summary
# - Celestial Tower's ghosts of mourning (Litwick's family, the user's request; Yamask from the graves, Duskull who
#   guides the lost; Chingling and Chimecho at the bell on the top floor). The Strange House's mischief instead (the
#   user's request): Gastly, Misdreavus, Shuppet and Banette, none only there. Route 7's will-o'-the-wisp marsh at
#   night (the user: ghosts at night near the tower), and Reversal Mountain's pass at night by the Strange House.
# - The Dreamyard's dream research: Munna at night, Drowzee, Abra; Musharna the trophy of the basement.
# - Ancient guardians: Relic Castle's tomb (Yamask, Sigilyph, Bronzor, Baltoy), Dragonspiral Tower and Victory
#   Road's ruins (Golett, Bronzor), Clay Tunnel's Underground Ruins (Golett, Baltoy: clay).
# - Space (the user's request): Giant Chasm, a meteor crater, holds Cleffa and Clefairy (where shooting stars fall),
#   Lunatone at night and Solrock by day, Elgyem (with the desert's UFO story), Solosis, Ditto; the chasm is this
#   dictionary's Moon Stone site, so Clefable is wild there, very rarely.
# - Others: Ralts as Route 2's trophy (the user's Petalburg memory), Gothita and Solosis on Route 5 (the user's
#   request), Mime Jr. and Mr. Mime among Route 5's street performers, Porygon loose on P2 Laboratory's island (the
#   user's request), Kecleon unseen (met by a step only), Castform only in the weather.
# - Not wild: Spiritomb (an Odd Keystone: a special encounter, report.md) and Togepi's family (an egg to be given:
#   report.md); Gengar, Alakazam, Dusknoir, Porygon2 and Porygon-Z (trades); Mismagius, Chandelure, Gallade (stones).
# - Review: Musharna and Clefable by place; Chimecho and Clefairy and Mr. Mime wild though they come by friendship or a
#   move (natural adults); Ralts as a trophy.

