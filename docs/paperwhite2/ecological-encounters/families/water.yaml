# Batch 2: water (42 families). Draft of 2026-11-14 for review.
#
# Summary
# - Fresh water by kind: small ponds (Magikarp, Poliwag, Lotad, Surskit, Tympole; Feebas the trophy of Striaton's),
#   lakes (Psyduck, Goldeen, Barboach, Marill, Red-Striped Basculin on Route 3), cold clear rivers (Basculin by side of
#   the Castelia-Nimbasa-Opelucid line, Bidoof's dams, Buizel's otters, Marill in strong currents, Seaking spawning at
#   the bridges in autumn), Icirrus's fens (Tympole, Wooper, Stunfisk, Croagunk and Barboach in the mud; only the
#   water's Pokémon in winter).
# - The sea by temperature, from the cool open sea of Routes 17 and 21 (Seel and Spheal in winter, Wailmer feeding in
#   summer, Carvanha, Frillish, Chinchou in the deep) to Humilau's warm reef (Corsola, Luvdisc, Horsea, Remoraid with
#   Mantyke and Mantine, Lileep very rarely in the shallows). Shellos by temperature: pink in Humilau and Undella, blue
#   round Routes 17 and 18. Lapras crowd Humilau and Undella in summer, when the reef fish there drop a tier.
# - Rippling water holds the big ones: Gyarados in the vast waters, Wailord, Sharpedo, Jellicent, Alomomola,
#   Whiscash, Seaking, Golduck, Floatzel; Basculin schools in rippling surf; Relicanth by Undella's dive spots.
# - Trophies: Totodile in Castelia's sewers (spring and summer), Feebas (Striaton's ponds, Abundant Shrine, Route 23's
#   pond), Relicanth (Undella), Lileep (Humilau).
# - Not wild: Poliwrath and Starmie and Cloyster and Ludicolo (stones), Politoed, Slowking, Kingdra, Huntail and
#   Gorebyss (trades), Milotic (beauty), Croconaw and Feraligatr; Cradily is wild only as Lileep evolves (no).
# - Review: Corphish as introduced; Lombre at fishing spots; Seel and Spheal as winter visitors to a sea without ice;
#   whales calving in the warm east in winter.

