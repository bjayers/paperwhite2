# My assessment of each place's draft, for the user's review (2026-11-14). tools/place_reviews.py puts each entry
# under its place's tables in reviews/<region>.md. Per place: vision, good (satisfied with), unsure (not satisfied,
# or unsure), ideas.

# --- Southwest Unova ---

aspertia_city:
  vision: >-
    A garden pond by the player's house: a gentle, familiar start with lily pads, tadpoles and a duck, and Magikarp on
    the line.
  good:
    - >-
      Small and people-tolerant, as the place asks; the same as Route 19's pond, so the two read as one kind of water.
  unsure:
    - >-
      Winter leaves only Ducklett to surf (Lotad and Tympole sleep), which is right ecologically but bare; rippling water
      then falls back to Ducklett and Swanna.
    - Fishing is Magikarp alone all year. Fine for a garden pond, but Goldeen (released pets) would give a second bite.
  discussed:
    - >-
      2026-11-14: no change asked; Goldeen as a second bite is still open.

route_19:
  vision: >-
    The gateway: Patrat with Ekans hunting them, Purrloin and Pidove by the city, the NPCs' Pokémon kept close, and
    the valley's migrants passing through in spring and autumn (Pidgey, Taillow, Hoppip in spring).
  good:
    - Every NPC's Pokémon is wild here (Buneary, Ekans, Lillipup, Patrat, Pidgey, Pidove, Purrloin, Seedot, Sentret,
      Shroomish, Spearow, Swinub).
    - The seasons change the route from the very first steps, as the place's suggestion wanted.
  unsure:
    - >-
      Your picture says Swinub rarely and only in winter, and Shroomish rarely. I made Swinub common in winter and
      Shroomish uncommon (following the Pokécology mushroom idea). I'd bring both down to rare to match your picture.
    - >-
      It's crowded for a first route: 13 families in spring, with five commons (Patrat, Pidgey, Pidove, Seedot,
      Sentret). Seedot and Sentret could drop to uncommon so the starting pool feels like Patrat, Purrloin and the birds.
  ideas:
    - Hoppip in spring could go, since Route 1 and Floccesy have the spring winds already.
  discussed:
    - >-
      2026-11-14, done: Buneary a spring rarity, Seedot in autumn (rare into winter), Shroomish in autumn only, Swinub a winter rarity, as the user had them. Crowding is acceptable where it's believable. Evolved stages now appear here too at high levels.

floccesy_ranch:
  vision: >-
    A working ranch: herding dogs, Furret hunted by Mightyena, the dairy herd, barn swallows in summer and owls at night,
    Diglett tilling the fields, Bidoof at the river, and the trophies Riolu (summer and autumn) and Shinx (winter).
  good:
    - The farm's story is all here, and the river shares its Blue-Striped Basculin and Marill with Route 20.
    - Happiny and Chansey with the NPCs, as you asked.
  unsure:
    - >-
      Your NPC list gives seasons (Ledyba in autumn, Sentret in spring, Furret in summer, Seedot in autumn, Poochyena
      in summer, Shroomish in autumn, Happiny in summer); I made most of them all year. Should the wild ones follow the
      NPCs' seasons more closely?
    - >-
      Still the most crowded table (14 at a winter night), mostly because the winter visitors (Starly, Swinub, Shinx)
      join a full year-round cast.
    - Azurill in the grass by the river is a small stretch; it could stay in the water as Marill only.
  ideas:
    - If the NPC seasons should rule, Seedot and Shroomish autumn-only here would also thin the crowd.
  discussed:
    - >-
      2026-11-14, done: Diglett gone (a ranch grows no crops), Mareep common (it's a Mareep ranch), Seedot in autumn (rare into winter), Poochyena uncommon in spring and summer and rare in the cold months.

route_20:
  vision: >-
    The autumn route: in spring and summer caterpillars, Oddish and centipedes; in autumn the cocoons, butterflies and
    moths, spiders, mushrooms and Ledyba in the leaves; in winter owls and Swinub digging up the buried mushrooms.
  good:
    - It follows your NPCs' seasons closely, and autumn is clearly its peak (eight families at once).
    - The stream is cold-water trout country (Blue-Striped Basculin, Goldeen), shared with the ranch.
  unsure:
    - >-
      Winter is very quiet: Hoothoot at night, Swinub, Ledyba, Pidove, Bidoof and Seedot. Right for a sleeping forest,
      but the grass and dark grass are almost the same lists.
    - >-
      The two grasses differ little through the year; the dark grass is "thick, wild grass deeper in the woods" and
      could hold the shyer things more clearly (Paras, Foongus and Swadloon already are).
  ideas:
    - Weedle or Venipede's evolved forms deeper in, or a rare Pinsir or Heracross in summer, for the dark grass.
  discussed:
    - >-
      2026-11-14: the user likes it as it is, and may move the dark grass deeper in the woods, past Surf, among the brightest autumn leaves (places/southwest.yaml, plans); then its dark grass gets its own, later and wilder habitat.

virbank_city:
  vision: >-
    A gloomy industrial harbour: gulls over it, Grimer in the polluted water, Floatzel as the port's familiar, and
    Corphish thriving in the dirt.
  good:
    - It reads as a port, not a resort, which is what you described.
  unsure:
    - Only one fishing family (Corphish) all year; the harbour where the river comes in could also have the river's
      fish (Goldeen, Basculin) as the places' suggestion said.
    - Tentacool only in summer is fine, but the harbour is otherwise the same in every season.
  discussed:
    - >-
      2026-11-14, done: Floatzel gone (it wouldn't like the murky water); the river's Goldeen and Blue-Striped Basculin fish where it comes in.

virbank_complex:
  vision: >-
    The industrial complex kept close to its NPCs: Klink, Magnemite, Koffing, Voltorb and Grimer among the machinery,
    Timburr's family working, Purrloin on the pipes, Mawile chewing the iron, Skarmory nesting on the steel; Magby and
    Elekid by the machines' seasons, and the trophies Pichu, Growlithe and Riolu.
  good:
    - Every NPC's Pokémon is here, and the seasonal swaps you asked for (Magby and Elekid, Pichu and Growlithe) work.
  unsure:
    - >-
      Five commons at once (Klink, Koffing, Magnemite, Purrloin, Timburr) and up to three trophies at a time in winter
      and spring (Growlithe, Riolu, plus Electabuzz very rare). It may feel like a list rather than a place.
    - Map 1 (by the water, small) and map 2 (inside) share everything except Riolu; you thought a trophy might be map
      2's only, which is how Riolu is now.
  ideas:
    - Drop one or two of the commons to uncommon (Koffing or Klink), or keep Klink to map 2, deeper among the machines.
  discussed:
    - >-
      2026-11-14, done: Klink only deeper inside (map 2).
    - >-
      2026-11-14: Skarmory stays at its low levels here, the user's hand-placed counter to the second gym (it has an NPC there).

# --- Castelia and the desert ---

castelia_park:
  vision: >-
    A small walled garden in the middle of the city: crows and rats, strays and scavengers, pets gone feral (two
    regions' cats), the park's squirrel, and two trophies: a lost Eevee and the feral Chatot colony.
  good:
    - Small and urban, with night visitors (Murkrow, Rattata, Zigzagoon) different from the day's.
  unsure:
    - >-
      Your picture names Snubbull, Meowth, Minccino and Cinccino too, and I trimmed Snubbull and Meowth out (and never
      put Minccino here) to keep the garden small. I'd put your list back and take out what you didn't name
      (Pachirisu, and Chatot unless you like the feral colony) instead.
    - Two trophies in one tiny garden may be one too many.
  discussed:
    - >-
      2026-11-14, done: the user's list back (Pidove common, Snubbull, Meowth, Minccino); Pachirisu and Chatot gone (Pachirisu lives on Routes 2, 3 and 6; Chatot on Route 18 and at Village Bridge), so Eevee is the one trophy; seasons: Budew in spring, Nincada and Venonat at the lights in summer, Starly murmurations in autumn and winter.

castelia_sewers:
  vision: >-
    Sludge, gas and rats on the walkways; carp and invasive crayfish in the canals while there's water; the sewer
    alligator (Totodile) as the trophy in spring and summer; in the dry seasons Sandile in from Relic Passage and the
    crayfish crawling the dry tunnels.
  good:
    - Your two requests (Totodile, Sandile) and the seasonal water fit together into a story.
  unsure:
    - >-
      The walkways have only three to five families. The sewers are big (five maps), so that's thin; Trubbish (trash),
      Zubat or Woobat, and Stunky would fit the dark, dirty tunnels.
    - Corphish on the dry floors in autumn and winter is my stretch; say if it should stay in the water only.
  discussed:
    - >-
      2026-11-14, done: Trubbish, Zubat and Stunky (at night) on the walkways all year.

route_4:
  vision: >-
    A desert road at the city's edge: Sandile and Sandshrew in the sand, Darumaka and Scraggy's gangs, Mandibuzz
    overhead, Flygon and Krookodile hidden in the sandstorms, a Sandy-Cloak Burmy; gulls and jellyfish in the bay.
  good:
    - The sandstorm Pokémon follow your Pokécology note.
  unsure:
    - >-
      Black 2's Route 4 has no sandstorm now, so its Flygon and Krookodile can't appear there (weather.md suggests
      adding an occasional one). White 2's always has a sandstorm, so there they're just rare Pokémon.
    - Fishing is Finneon alone; the bay could take Krabby or Shellos too.
    - The vanilla Braviary is only on the path and in the static battle, not on Route 4 itself.
  discussed:
    - >-
      2026-11-14, done: a little seasonal change (Hippopotas more in summer, Darumaka common in winter, Mandibuzz wintering). The user will give Black 2's Route 4 the odd sandstorm, so its Flygon and Krookodile appear there sometimes. Fishing (Krabby, pink Shellos) still open.

desert_resort_path:
  vision: >-
    The canyon between Route 4 and the dunes: cliff-nesting vultures and Gligar, Cubone among the bones, burrowers and
    pit traps in the sand, cacti, and Braviary hunting from the ledges.
  good:
    - It's a true mix of Route 4's and the desert's Pokémon, as you described, with the canyon's own cliff-dwellers.
  unsure:
    - >-
      Nothing is common, so everything is equally likely: it reads as "rough and wild", but there's no signature
      Pokémon. Sandshrew or Cubone could be common here.
  discussed:
    - >-
      2026-11-14, done: Cubone and Gligar common as the canyon's own; Vullaby common in spring (nesting); Spearow passing in spring and autumn.

desert_resort:
  vision: >-
    The open dunes: pit traps and burrowers by day, cacti that hunt at night, Hippopotas colonies, Sigilyph guarding the
    statues, Darumaka; Flygon and Krookodile in the sandstorms, and a very rare Elgyem at night (its UFO-crash story).
  good:
    - It's the desert batch's heart, and day and night differ (Cacnea and Cacturne, Skorupi).
  unsure:
    - >-
      Fifteen families, the second most crowded table. Natu and Mandibuzz could leave the dunes (they have the path
      and the badlands), and Elgyem could go to Giant Chasm only.
    - >-
      It's always a sandstorm today, so Flygon and Krookodile are simply rare until you add clear days (your wish in
      weather.md).
  discussed:
    - >-
      2026-11-14, done: Maractus common in spring with a very rare Combee in the bloom; Skorupi, Cacturne and Hippopotas common in summer; Darumaka common and Mandibuzz uncommon in winter; Elgyem only in Giant Chasm now.

relic_castle:
  vision: >-
    The sinking tomb: Yamask and Cofagrigus above all, Cubone mourning among the bones, Baltoy and Bronzor as ancient
    figurines, Sigilyph guarding it, Darmanitan still as statues, and Gabite after the treasure.
  good:
    - Yamask leads, as you said, and it's all ancient or desert life.
  unsure:
    - Unown is on hold; this would be a fine home if it comes back.
    - It's the same in all eight maps; the deeper floors could hold the rarer ones (Darmanitan, Gabite) only.
  discussed:
    - >-
      2026-11-14: no seasons, as the user agrees; Gabite only in its deepest rooms (relic_castle_6 to _8, if those are the deepest: to check).

relic_passage:
  vision: >-
    A desert cave: bats and rock dwellers, Sandile thinning out toward the sewers, burrowers in the dust clouds, mud
    fish in the pool, and Gible as a hidden trophy in the sandy caves (as Sinnoh's Wayward Cave).
  good:
    - It links the desert and the sewers' Sandile story.
  unsure:
    - >-
      Gible here is early in the game; the level gate holds Gabite and Garchomp back, but even Gible is a pseudo-
      legendary. A good trophy, or too early?
    - Barboach is the pool's only Pokémon.
  discussed:
    - >-
      2026-11-14, done: Gible kept here from level 40; Blue-Striped Basculin in the pool.

# --- Southeast Unova ---

route_1:
  vision: >-
    Two worlds across an inlet. The meadow changes with its flowers: Cherubi, Budew, Caterpie and the spring winds'
    Hoppip in spring; Sunkern falling on summer mornings and Sunflora; Cottonee, Kricketot and the Starly flocks in
    autumn; wintering Pidgey and Starly. The pine hills don't change: Pineco and Weedle in the pines, owls at night,
    a rare Mightyena. Gulls, Slowpoke and crabs in the inlet.
  good:
    - The meadow's seasons are the places' plan, and the pine hills stay their own world.
    - It's the start of the coastal flyway (Pidgey, Taillow, Starly).
  unsure:
    - >-
      Spring is busy (ten families, six common) and winter quiet (four). Spring could lose Combee (Route 12's) or
      Ekans.
    - The pine hills have only four families; Murkrow, Spinarak or Stunky would fit the pines at night.
  discussed:
    - >-
      2026-11-14, done: the pine hills gain Murkrow and Stunky at night all year and Spinarak in summer and autumn. The Southeast is post-game in B2W2, so no level limits are needed here.

route_2:
  vision: >-
    A dirt road through light woods between towns: the woodland edge's rabbits, squirrels, caterpillars and owls, a
    passing Pidgey in autumn and winter, and Ralts as the trophy (your Petalburg memory).
  good:
    - It's ordinary in a good way, an edge between towns, and Ralts gives it a reason to come back.
  unsure:
    - >-
      It's grass only (no dark grass), so twelve families share one table, and nine are uncommon: Lillipup, Seedot or
      Oddish could go to keep it simple and let Ralts stand out.
  discussed:
    - >-
      2026-11-14, done: Lillipup gone and Poochyena added; Ralts also a trophy on Route 16's grass, before the post-game (the user).

striaton_city:
  vision: >-
    A formal park's ornamental ponds: goldfish and carp, a duck, lily pads, released crayfish, and Feebas the trophy
    (your request).
  good:
    - Small and gentle, with Feebas where you asked.
  unsure:
    - Surfing is only Ducklett and Lotad (Ducklett alone in winter); a Poliwag or Psyduck would help.
  discussed:
    - >-
      2026-11-14, done: Poliwag (spring to autumn) and Psyduck (all year) in the ponds. Feebas is also a trophy on Route 14 now (the user).

route_3:
  vision: >-
    The Day Care's route: old fields and a lake. Patrat, Sentret and the Day Care's odd strays (Skitty, Azurill,
    Jigglypuff, a very rare Chansey) in the grass; Blitzle herds and Purrloin in the wild edges; ducks, frogs,
    Psyduck and lake fish in the water; fireflies and dragonflies in summer, Starly flocks in autumn and winter.
  good:
    - The lake is full and lively, and the strays give the Day Care idea a light touch.
  unsure:
    - The dark grass (the route's wild edges) has only four families and no common one; Ekans, Poochyena or Scyther
      (very rare now) could lead it.
    - The grass is busy in summer (twelve families).
  discussed:
    - >-
      2026-11-14, done: Blitzle common in the dark grass, as in the original (Zebstrika's grotto here too); its only other home is Route 22's upland.

wellspring_cave:
  vision: >-
    A small spring cave in the south: bats and rock dwellers, Drilbur and Diglett in the dust, Whismur echoing, Paras
    in the damp, and Slowpoke in the spring-water pools (Unova's Slowpoke Well).
  good:
    - The Slowpoke Well idea gives a small cave a character.
  unsure:
    - >-
      Two maps share everything; fine for a small cave. Whismur here is now its main home along with Clay Tunnel,
      after it left Village Bridge.

dreamyard:
  vision: >-
    A ruined dream-research site: psychics by night (Munna, Drowzee), sleeping Abra by day, Gastly in the ruins at
    night, Natu watching, Smeargle's marks on the walls, a very rare Ralts, and Musharna as the basement's trophy.
  good:
    - It's clearly the psychic place, and night is its time.
  unsure:
    - The grass has no common family; the day is only Abra and Patrat. Fine for an eerie place, or too empty?
    - Check that dreamyard_2 is the basement (Musharna is limited to it).
  discussed:
    - >-
      2026-11-14, done: Cottonee drifting through in autumn and Venonat on summer nights; Smeargle moved to the deepest part of Relic Passage, painting its walls.

pinwheel_forest_outskirts:
  vision: >-
    The insects' nursery: dragonflies and pond skaters over the puddles in summer, with Swellow hunting them,
    fireflies at night, Croagunk in the wet cliffs, and the edge's rabbits and Patrat.
  good:
    - Summer is clearly its season (Yanma common, Taillow hunting them).
  unsure:
    - >-
      It doesn't feel like a nursery of biting and buzzing bugs yet: only Yanma and Surskit are bugs. Venonat
      (mosquito-like, drawn at night), Nincada or Combee would make it buzz.
    - Winter is the sparsest table in the game (two families in the grass).
  discussed:
    - >-
      2026-11-14, done: Venonat at night from spring to autumn, Combee and Nincada in summer, Sewaddle in spring.

pinwheel_forest:
  vision: >-
    The old forest: the bugs' life cycle by season in its lighter grass, the elemental monkey Pansage, owls at night;
    in the mossy depths centipedes, fungi, Karrablast hunting Shelmet, Tangela, the shy Nuzleaf and a very rare Shiftry
    (its Leaf Stone), and two trophies: Leafeon in spring and summer (your request) and Pinsir in summer.
  good:
    - The depths feel different from the road's edge, and the seasons are strong.
  unsure:
    - The pond fishing is Magikarp only.
    - Winter grass is quiet (Hoothoot, Burmy, Ledyba, Pansage); right for a sleeping forest.
    - Throh and Sawk lived here in the original; I moved them to Route 11's falls as the places asked.
  discussed:
    - >-
      2026-11-14, done: all three elemental monkeys as trophies all year in the grass; Aipom, Mankey and Slakoth rare in the dark grass in winter, very rare otherwise. Hoothoot and Venonat stay night-only everywhere.

# --- Central Unova ---

route_5:
  vision: >-
    The busy road at Nimbasa's edge: scavengers and food-lovers by the trash and the cook (Trubbish, Zigzagoon,
    Meowth, Gulpin, Lickitung), Pidove and Patrat, the street performers' Mime Jr., Gothita and Solosis (your request),
    winter Starly flocks, and Munchlax as the trophy (your request).
  good:
    - Your three requests are here, and the scavenger theme gives the road a clear identity.
  unsure:
    - >-
      Still crowded (thirteen families in the grass), with four commons in autumn and winter. Starly could stay in the
      dark grass only, and Minccino go to Routes 9 and 16.
    - Munchlax is exotic in both grasses; your "rarely" might want only one.

route_16:
  vision: >-
    A blend of Nimbasa's city edge and Lostlorn's forest: the city's Patrat, Pidove and Zigzagoon, Plusle and Minun
    cheering by the stadiums, Venonat and Dustox at the lights at night, Murkrow and Stunky; behind the fence, the
    forest edge's Buneary, Emolga, Oddish and Ledyba, with a very rare Gothita.
  good:
    - The grass (the city's verges) and the dark grass (the forest) are different habitats, as the place says.
  unsure:
    - The grass is busy (twelve at a summer night); the dark grass, the forest's side, has no common and only five.
    - Some of the forest's Lostlorn neighbours (Sewaddle, Pansage) could cross into the dark grass.

lostlorn_forest:
  vision: >-
    The forest where something isn't right: Spinda tottering about, all three elemental monkeys, Foongus pretending to
    be a Poké Ball, an unseen Kecleon, Ditto, Misdreavus and Murkrow at night; the usual forest life behind them (owls,
    Emolga, Sewaddle, Combee in the clearing), and Sawsbuck sheltering in winter.
  good:
    - Your "off" theme is clear, and Spinda leads it.
  unsure:
    - >-
      Spinda is common in both grasses all year; with three monkeys uncommon in both, the two grasses are nearly the
      same. The dark grass (above the waterfall) could keep the strangest ones (Kecleon, Ditto, Misdreavus) and the
      grass the ordinary forest.

marvelous_bridge:
  vision: >-
    A long bridge over the sea: gulls and Pelipper in its shadows all year, and Swanna passing over in spring and
    autumn on their way to and from Icirrus.
  good:
    - It's a crossing, and the shadows show the swans' passage.
  unsure:
    - Only two families. Raptors (Braviary, Mandibuzz) or Ducklett would make the shadows less predictable.

route_15:
  vision: >-
    A misty ridge of boulders and scrub: Geodude among the rocks, Spearow and Swablu above, sheep (Mareep) on the hill
    grazing, Sudowoodo standing out among bare scrub in winter, savanna and scrub Pokémon rarely (Doduo, Girafarig,
    Kangaskhan, the two Nidoran), and the ledges' Gligar, Skarmory, Mankey and Rufflet.
  good:
    - It's rugged and different from the routes round it.
  unsure:
    - >-
      Geodude is the only common, so it dominates; Spearow or Mareep could share it.
    - The dark grass has seven families, all rare; it reads as a list of rarities rather than a place.

route_14:
  vision: >-
    Trout country under the Forces of Nature's storms: otters (Buizel) and Marill in the cold rivers, Red-Striped
    Basculin schools, Seaking spawning in autumn; monks meditating under the waterfalls (Meditite), fighters on the
    cliffs (Mankey, Mienfoo, Throh), Rufflet, and Electrike and Absol coming with the storms.
  good:
    - The water is full, and the storms give it a story once you add rare thunderstorms (weather.md).
  unsure:
    - >-
      The grass (overgrown paths between the rivers) is too thin: Meditite, a rare Panpour and Electrike, with more
      Electrike only in storms. It needs a few ordinary residents: Pidove, Buneary, Seedot, or the river's Bidoof.
    - Until the storms are added, Absol and the storm Electrike never appear here.

abundant_shrine:
  vision: >-
    A satoyama shrine: Diglett tilling the terraced fields (your request), the paddies' frogs, Wooper, Lotad and
    crayfish, dragonflies and fireflies in summer, crickets in autumn, the shrine fox (Vulpix) and sumo Makuhita in
    the grove, Pineco and hornets in the conifers, Farfetch'd and Feebas as its trophies, and the storms' Electrike,
    Absol and Castform.
  good:
    - It's one of the richest and most coherent places; each season changes it.
  unsure:
    - >-
      Two trophies (Farfetch'd, Feebas) plus a rare Vulpix and Absol; that's a lot of prizes for one shrine, though
      they're on different methods.
    - Lillipup and Miltank are generic farm animals; the paddies could do without them.

# --- Western Unova ---

driftveil_drawbridge:
  vision: >-
    The original's Ducklett bridge: Ducklett and gulls in the shadows all year, and Swanna passing in spring and autumn
    between Icirrus and the south.
  good:
    - It keeps the original's identity and adds the swans' passage.
  unsure:
    - Three families, and the same two commons every season; a raptor (Braviary) in the shadows now and then would
      surprise.

route_6:
  vision: >-
    An Appalachian river valley: Deerling and Sawsbuck in the season's form (your request), Swellow hunting Yanma in
    spring and summer (your Pokécology note), Karrablast and Shelmet, Sewaddle and Oddish in the woods, Emolga gliding
    near Chargestone with a rare Pikachu, Foongus and Ledyba in autumn, snow Pokémon in winter; the river's Marill,
    Bidoof, Blue-Striped Basculin and Seaking spawning at the bridges in autumn (your request).
  good:
    - It hits all of your requests and changes clearly with the seasons.
  unsure:
    - >-
      The grass is busy in spring and summer (eleven families), with Swellow, Taillow, Deerling, Oddish and Hoothoot
      all common or near it.
    - Pikachu is rare in the grass and in Chargestone; fine, but it's one of the few routes where a starter-famous
      Pokémon turns up.

chargestone_cave:
  vision: >-
    A cave of floating charged stones: Joltik feeding on the field, Ferroseed on the iron, Klink, Magnemite, Nosepass
    pointing north, Boldore's crystals, Aron on the magnetite; the field's evolutions (Raichu, Probopass, Magnezone),
    and Tynamo's line as the trophy (your request).
  good:
    - It's entirely the magnetic, electric cave the place describes.
  unsure:
    - >-
      Four exotics or near-exotics (Raichu, Probopass, Tynamo's line, Magnezone very rare) in one cave dilutes Tynamo
      as your trophy. I'd make Probopass and Magnezone very rare rather than exotic, and keep Tynamo and Raichu as the
      trophies, or Tynamo alone.

mistralton_cave:
  vision: >-
    A rocky cave down to the Guidance Chamber: rock dwellers and bats, Aron on the ore, Drilbur in the dust, and Axew as
    the original's young dragon (the trophy).
  good:
    - Simple and in keeping with the original.
  unsure:
    - Three maps share five families; the deeper maps (the Guidance Chamber) could hold Axew only, deeper in.

route_7:
  vision: >-
    The gloomy marsh below Celestial Tower, with tall grass over the head: Murkrow at night, Duskull and Drifloon
    drifting from the tower, Litwick as will-o'-the-wisps, Zangoose and Seviper fighting in the grass, Croagunk and
    Stunfisk in the marsh, Swellow following Yanma in summer, Castform in the rain, snow Pokémon in winter, and two
    trophies: Honchkrow at night and Scyther in summer and autumn.
  good:
    - Your "ghosts at night near the tower" is the route's theme, and the tall grass suits its hidden hunters.
  unsure:
    - >-
      By day it's thin: Murkrow and the ghosts are night only, so a daytime spring has Croagunk, Surskit and a few
      rares. A day-active marsh resident (Yanma in spring too, or Pidove's rain birds) would help.
    - Two trophies here as well (Honchkrow, Scyther).

celestial_tower:
  vision: >-
    The melancholy tower of graves: Litwick's candles (your request), Yamask from the graves, Duskull guiding the lost,
    a few Gastly at night, Cubone mourning, the tower's bats, and Chingling and Chimecho by the bell on the top floor.
  good:
    - Ghosts of mourning, distinct from the Strange House's pranksters, as you asked.
  unsure:
    - Chimecho needs the top floor's table to be real (STATUS.md's open item).
    - The three floors are the same; Lampent could be limited to the upper floors.

# --- Icirrus ---

icirrus_city:
  vision: >-
    Dutch polders round a town: frogs, Wooper, Stunfisk (as in the original) and pond skaters in the puddles from spring
    to autumn, dragonflies in summer; catfish and carp in the water all year; Ducklett on the peat in the warm months
    and the northern swans (Swanna) wintering on the open water.
  good:
    - The winter freeze leaves only the water, as the place says, and the swans make winter worth visiting.
  unsure:
    - Surfing is a single family per season (Ducklett, then Swanna); Poliwag or Wooper in the water too would help.

route_8:
  vision: >-
    The same fens as the town, a little wilder: Stunfisk, Tympole and Wooper in the puddles, Croagunk rarely, the same
    water.
  good:
    - It shares the Moor's and the town's marsh, as the place says.
  unsure:
    - It's nearly a copy of Icirrus City; Carnivine or Yanma rarely would set it apart.

moor_of_icirrus:
  vision: >-
    The marsh's deeper, wilder part: the bigger toads (Seismitoad in the rippling water), Croagunk, Wooper, catfish,
    Poliwag in the pools, and Carnivine as the bog's carnivorous trophy.
  good:
    - The bog oddity (Carnivine) gives it its own prize.
  unsure:
    - The puddles have only five families; the moor's low hills could add a land Pokémon or two (Stantler, Mareep).

dragonspiral_entrance:
  vision: >-
    The cliffside below the tower: a quiet meadow from spring to autumn (Mienfoo training, Tranquill, Mareep, Rufflet),
    and winter as its real season, when the snow brings the dark grass and the ice Pokémon: Cubchoo, Vanillite, Snover,
    Swinub, Delibird, Smoochum, Sneasel, Stoutland warm in its fur, Piplup with Glalie hunting it (your request), Absol
    out of the blizzard and Cryogonal in the diamond dust.
  good:
    - Winter is a clear event, and your Piplup and Glalie story is there.
  unsure:
    - >-
      Spring to autumn is thin and generic (four families, nothing common); the cliff meadow needs a resident with
      more character, or one common Pokémon.
    - Winter is now crowded (nine in the grass).

dragonspiral_grounds:
  vision: >-
    A clear, deep, cold lake round the tower: Dratini as the dragons' trophy in the rippling water, Gyarados, Golduck,
    Blue-Striped Basculin; on the bank reached only by water, shy Pokémon (Stantler, Mienfoo, the watching Natu), and
    Ducklett's few breeding swans in summer.
  good:
    - The lake as a sacred dragon's water works.
  unsure:
    - The two grasses are identical and thin (three families), and nothing is common.
    - Surfing has a single family most of the year.

dragonspiral_tower:
  vision: >-
    The ancient tower: Golett as its guardians, Druddigon as the original's dragon, and Bronzor as an ancient relic.
  good:
    - It keeps the original's two signature Pokémon.
  unsure:
    - >-
      Only three families over four floors, with no cold-loving residents yet (the places suggest them): Vanillite,
      Sneasel or Cryogonal in winter, Woobat, or Mienfoo inside.

# --- Northern Central Unova ---

route_9:
  vision: >-
    Opelucid's outskirts by the mall: scavengers at the trash and food stands (Zigzagoon, Trubbish, Gulpin, Stunky),
    alley cats (Glameow, Persian), dog walkers' strays (Snubbull), Venonat and Dustox at the lights at night, Pidove,
    Murkrow, and Pidgey breeding in summer.
  good:
    - The mall's people give it a clear urban-edge identity, different from Route 5's road.
  unsure:
    - >-
      It's very close to Route 5 in feel (both scavenger routes). Route 9's meadow and woodland edge could take a
      little more countryside (Buneary, Kricketot all summer, Sentret).
    - Night and day differ a lot; by day it's Pidove, Zigzagoon, Minccino and the trash Pokémon.

route_11:
  vision: >-
    Fighters training by the waterfalls (your request): Throh above, Sawk below, Tyrogue in both with Hitmonlee above
    and Hitmonchan below, Meditite, a very rare Hitmontop; the conifers' Pineco and Weedle, Teddiursa and owls below;
    Buizel and Red-Striped Basculin in the river.
  good:
    - The two levels are clear counterparts, as the places asked.
  unsure:
    - >-
      Nothing is common anywhere, and the fighting families are all rare or uncommon, so encounters spread thinly.
      Pineco (above) and Teddiursa (below) could be common to anchor them.
    - The river has only two families.

village_bridge:
  vision: >-
    A quiet village of music (reviewed with you): Kricketot singing at dusk, Jigglypuff, Chatot drawn in summer,
    Altaria wintering; the village's dogs and pigeons; the clearing's pollinators and flowers all year; swallows and
    pigeons under the arches; a fishing village's river with Seaking spawning in autumn.
  good:
    - It's as we discussed, serene and rustic, with Whismur gone.
  unsure:
    - Spring's field has no common family (four uncommons).

route_12:
  vision: >-
    The flower hills, as Floaroma (reviewed with you): Combee and the honey trees' Pokémon, pollinators and flowers in
    spring and summer, Sunkern and Sunflora, Kricketot and Cottonee in autumn; a quiet, snowless winter of Starly
    flocks, Buneary, Deerling in its winter form, Poochyena hunting and a rare Vespiquen guarding the hive.
  good:
    - Its seasons now match its climate, with no snow Pokémon.
  unsure:
    - >-
      Summer's grass is busy (eleven families); Wurmple and Cherubi could leave summer, as I mentioned.

giant_chasm_outside:
  vision: >-
    The countryside round the chasm, touched by its cold and strangeness: Pidove, dogs and Poochyena, Spoink bouncing
    on the rim, a rare Clefairy at night; in winter Snover, Stantler and Delibird down from the crater; Rufflet and
    Sneasel at the edge.
  good:
    - The hint of strangeness (Clefairy, Spoink) without spoiling the crater.
  unsure:
    - >-
      It was empty before the balance pass and is still filled with fairly generic Pokémon (Lillipup, Pidove,
      Poochyena). A stronger idea for it would help: the woodland edge's own residents or the crater's spillover.

giant_chasm_caves:
  vision: >-
    A meteorite's caves round the crater: Lunatone at night and Solrock by day, Clefairy as at Mt. Moon, Zubat and
    Roggenrola, Sneasel and Cryogonal in the cold, Wobbuffet in the dark, Wooper in the cold water, and Beldum as the
    trophy (your request).
  good:
    - The space theme starts here, and Beldum has a home that fits.
  unsure:
    - The dust clouds have nothing of their own (they fill from the rares); a burrower (Drilbur) would fit.

giant_chasm_crater:
  vision: >-
    An unnatural winter all year (Kyurem's cold) and a meteor crater: ice Pokémon (Vanillite, Cubchoo, Snover,
    Cryogonal, Smoochum and Jynx, Snorunt, Delibird), Piloswine and Mamoswine as an ice age's last herd (the trophy),
    with Weavile hunting them; the space Pokémon (Cleffa and Clefairy where the star fell, Elgyem, Solosis, Lunatone
    and Solrock, Metang, Ditto).
  good:
    - It's the most otherworldly place in the game, as you wanted.
  unsure:
    - >-
      It's crowded (ten in each grass) and the two themes (ice, space) compete. The ice could lead the grass and the
      space Pokémon the dark grass, or the reverse.
    - Your Deoxys event in the crater is untouched by this.

route_23:
  vision: >-
    The western maze: an old conifer wood among boulders where stalkers hunt (Pawniard with Fraxure sharpening its
    tusks on the river's rocks, Zangoose and Seviper, Ursaring), the gorge's Mankey, Phanpy by the river, Rufflet on the
    cliffs, Stantler in the wood; Bagon leaping off the cliff island as the trophy, Sawk secluded there; the pond's
    Feebas.
  good:
    - It has the gorge, the river and the wood as three parts, as the places suggested.
  unsure:
    - The grass is crowded (twelve families) and the cliff island's dark grass has only four.

victory_road_mountainside:
  vision: >-
    The League's mountain, for the evolved and powerful: Graveler, Donphan, Rhydon, Machoke, Bouffalant herds, Durant
    and Heatmor, Skarmory, Medicham, Rufflet; Pupitar and Tyranitar, Shelgon and Salamence, Haxorus very rarely; and
    Altaria singing at the top as its trophy in summer.
  good:
    - It feels like the end of the game, with no early forms.
  unsure:
    - >-
      Nothing is common, and the dark grass has three very rare pseudo-legendary lines at once; that's a lot of
      power in one table.

victory_road_forest:
  vision: >-
    A high mountain forest: Pineco, Stantler, Ursaring and Hariyama, owls, Beedrill, Luxray hunting, snow Pokémon
    and Sneasel in winter.
  good:
    - A calm, strong forest between the mountain and the caves.
  unsure:
    - The grass and dark grass are almost the same; the dark grass could hold the strongest (Ursaring, Luxray,
      Hariyama) and the grass the rest.

victory_road_caves:
  vision: >-
    The deep caves: Durant's colonies and Heatmor hunting them, Golbat, Boldore, Onix, Aggron claiming the mountain,
    Druddigon in the tunnels, Sableye's gems, Excadrill and Dunsparce in the dust, Golduck and Whiscash in the pool, and
    the trophies Larvitar and Deino, with Garchomp very rarely.
  good:
    - The strongest cave dwellers, as the places asked.
  unsure:
    - Two trophies and a very rare Garchomp in one cave; Deino alone (as in the original) would be cleaner.

victory_road_ruins:
  vision: >-
    The ancient stone halls: Golett as guardians, Bronzor, Sigilyph's kin, and the old water's catfish and Golduck.
  good:
    - Different from the caves, as the places asked.
  unsure:
    - >-
      Only three families on the floors, and the ghosts the places suggested aren't here: Cofagrigus, Haunter or
      Dusclops would fit the ruins.

# --- The east coast ---

route_13:
  vision: >-
    The holiday coast: crabs and hermit crabs on the beach under the cliffs, gulls everywhere, the island as a seabird
    colony and wild refuge; clear coastal sea with Staryu on summer nights, jellyfish late in summer, otters, Corsola
    and pink Shellos in summer; migrants passing south in autumn.
  good:
    - The sea reads as a holiday coast, and the island is its own habitat.
  unsure:
    - >-
      The inland grass (343 tiles, the route's main grass) has only three families, none common: Krabby, Dwebble and
      Wingull. It needs the beach-and-dune land animals the places mention (sandpipers, dune grass): Sentret? Spearow?
      Ducklett? I'm not sure what best fits Unova's beach grass, and would like your view.
    - Shuckle is the only thing in the shaking grass apart from the automatic fill.

undella:
  vision: >-
    The resort's bay: pink Shellos, gulls, jellyfish in late summer with Tentacruel's outbreak, Frillish over the
    sunken ships' legends, Lapras and Corsola with the summer, lifeguard Floatzel, whales calving in winter, the reef's
    fish in summer, and Relicanth risen from the Abyssal Ruins as the trophy.
  good:
    - It follows the seasons of tourism and the warm sea, as you described.
  unsure:
    - Fishing outside summer is only Finneon (common) and two rares.

seaside_cave:
  vision: >-
    A sea cave: crabs and hermit crabs on the floors, bats in the dark, Shuckle under the rocks, Slowpoke and Shellder in
    the pools, seals in the cold seasons, Octillery in the holes, and Clamperl in the deep pools.
  good:
    - The original's Crustle (a static) fits its Dwebble.
  unsure:
    - The second map (no water) has the same floor Pokémon; fine.

route_21:
  vision: >-
    Rocky open sea: jellyfish, Frillish and gulls, Carvanha and Sharpedo, the rocks' Shellder, Remoraid, Horsea and
    Chinchou; whales passing in autumn and winter, seals in winter, Mantine and Alomomola in the rippling water, Lapras
    out of season.
  good:
    - It's the open sea's big-animal place.
  unsure:
    - Five fishing families all uncommon, so none stands out.

humilau_city:
  vision: >-
    The warm lagoon over coral: Corsola all year (gathering in winter, your request), Luvdisc, Mantyke with the
    Remoraid schools, Horsea nesting in the corals, pink Shellos, Mantine in the rippling water; Lapras crowding the
    reef in summer, when the fish drop a tier (your Pokécology note); Lileep as the shallows' living-fossil trophy.
  good:
    - The Lapras summer and the fish's return follow your notes exactly.
  unsure:
    - Nothing.

route_22:
  vision: >-
    The windswept upland between the coast and the chasm, as a savanna: herds (Tauros, Blitzle, Doduo), burrowers (the
    two Nidoran), hunters (Poochyena, Electrike), Mareep with Ampharos as the headland's beacon, gulls nesting on the
    cliffs, Swablu wintering, Drifloon blown over at night; Psyduck and Poliwag in the pond.
  good:
    - It gives the odd route an identity, as the places asked.
  unsure:
    - >-
      Nothing is common and the grass holds eleven families, the dark grass eight: it's a crowd of equals. Two or three
      should lead (Doduo and Blitzle, say).
    - Mareep is here too; after Route 12, is it still welcome on the upland?

# --- The Rest ---

reversal_mountain_outside:
  vision: >-
    A red-rock pass in Pueblo country: Spearow, vultures, Gligar and Skarmory in the badlands, wild mustangs (Ponyta),
    Numel by the fires, Rhyhorn and Girafarig in the scrub, Durant's anthills with Heatmor, Sudowoodo easier to spot in
    winter, ghosts and Murkrow at night by the Strange House (your request), and Charmander as the trophy.
  good:
    - The fire, the badlands and the ghosts at night all fit your picture.
  unsure:
    - >-
      Still crowded (eleven in the grass, twelve in the dark grass). The grass is the same all year; the sandstorms of
      spring and summer could bring something (Sandshrew, Hippopotas) as weather Pokémon.

reversal_mountain_fiery:
  vision: >-
    Unova's home for fire Pokémon (your request): Slugma and Numel by the lava lake, Torkoal, Magmar, Houndour's dens,
    Heatmor hunting Durant, Growlithe and Vulpix rarely, and the rock dwellers.
  good:
    - It's clearly the fire cave.
  unsure:
    - Thirteen maps with the same table; the deeper ones could hold the rarer fire Pokémon.

reversal_mountain_damp:
  vision: >-
    Moisture-loving cave dwellers instead of fire (your request): Paras's fungi, Shelmet's snails, cave bats.
  good:
    - No water Pokémon, as you asked.
  unsure:
    - >-
      Only three families for eight maps: too thin. Foongus, Croagunk (not a water type), Ferroseed on the wet ceilings,
      Sableye in the dark, Woobat, or Venipede in the damp would fill it.

strange_house:
  vision: >-
    A haunted house's pranksters (your request): Gastly, Shuppet and Banette as thrown-away toys, Misdreavus startling
    visitors, Duskull, a candle left burning (Litwick), bats in the rafters.
  good:
    - Mischief rather than grief, and none of them only here.
  unsure:
    - >-
      By day it's Shuppet (more at night) and the rares, since Gastly and Misdreavus are night only. A haunted house
      by day may be right to feel empty, but it's very thin.

twist_mountain:
  vision: >-
    A strip mine: the miners' companions (Timburr, Machop, Drilbur), Roggenrola and Aron on the ore, bats, and the ice
    Pokémon in the caves all year (your request): Cubchoo, Snorunt and Glalie, Vanillite, Cryogonal, Swinub; Glaceon by
    the Ice Rock in winter.
  good:
    - The mine and the ice share it well.
  unsure:
    - >-
      Eleven families at once on every floor; the four cave tables could split the mine (the upper tunnels) from the
      ice (the deep, cold ones).

clay_tunnel:
  vision: >-
    A mining cave with the Underground Ruins: miners' Pokémon, Roggenrola, Onix with Excadrill and Dunsparce (your
    Pokécology note), Druddigon running their tunnels, Diglett in the dust, Whismur's echoes; Golett and Baltoy in the
    ruins; Psyduck and catfish in the water.
  good:
    - The Pokécology tunnel trio is here, and the ruins have their own clay guardians.
  unsure:
    - The Regi chambers are in this place's maps too; they get the ruins' Pokémon only if they have tables at all.

p2_laboratory:
  vision: >-
    An island research station: Porygon escaped from the lab (your request), Magnemite and Voltorb from its machines, a
    rare Exeggcute and Tropius from Route 18 next door; blue Shellos, seals and gulls in the cool sea.
  good:
    - Lab-born Pokémon loose on an island is a clear story.
  unsure:
    - The grass (41 tiles) has nothing common; Porygon could be common, as the lab's own.

route_17:
  vision: >-
    The current-swept open sea: jellyfish and Frillish, whales feeding in summer, Carvanha and Sharpedo, blue Shellos,
    seals all year and Spheal in the cold; Alomomola, Lapras, Walrein and Dragonite guiding the shipwrecked in the
    rippling water.
  good:
    - It's the cold, strong sea, distinct from the east coast's warm one.
  unsure:
    - Fishing is Chinchou alone most of the year.
    - Dragonite is a very late trophy here; fine if you like a dragon at sea.

route_18:
  vision: >-
    A remote tropical island: Exeggcute and Exeggutor (your request), Tropius among the fruit trees, Chatot in its
    season (your request), Aipom, Slakoth, Tangela and Kecleon in the jungle, Bellsprout's family (Victreebel in the
    Leaf Stone jungle), Wynaut as on Mirage Island, Dwebble, Krabby and Scraggy on the beaches, Taillow wintering;
    blue Shellos and the cool sea round it.
  good:
    - It's the most distinct island in the game.
  unsure:
    - >-
      Your places note calls the sea round it cool, but the land is tropical; I kept both (blue Shellos in the water,
      jungle on land). Is that the feel you want?

nature_preserve:
  vision: >-
    A protected river forest, unlocked by the Unova Dex: Kangaskhan safe with its young, the two Nidoran, owls, Tangela,
    Teddiursa, Aipom and Slakoth in the thick growth, Heracross and Pinsir in summer, Bidoof and Basculin in the river.
  good:
    - It keeps your rule (no Unovan Pokémon only here).
  unsure:
    - >-
      It's not yet a reward. It should be the refuge for rare Pokémon of other regions (generations 1 to 4), and
      most of what's here lives elsewhere too. This is the place I'm least satisfied with: it could gather the
      game's hard-to-find foreign Pokémon (Kangaskhan, Tauros, Chansey, Scyther, Pinsir, Heracross, Eevee, Dratini in
      the river, Larvitar, Bagon or Gible very rarely), more common here than anywhere, as a late reward.
